<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>GITHUB-PRO | Bootstrap 5.3 Supreme Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="./src/styles.css" rel="stylesheet">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <!-- SUPREME HERO -->
  <section class="hero-gradient vh-100 d-flex align-items-center" data-aos="fade-up">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-6">
          <h1 class="display-3 fw-bold mb-4" data-aos="fade-right" data-aos-delay="100">
            John Doe
            <span class="badge bg-primary ms-2">Fullstack Supreme</span>
          </h1>
          <p class="lead mb-4" data-aos="fade-right" data-aos-delay="200">
            50+ GitHub Projects | 10K+ Stars | React/Vue/Next.js
          </p>
          <div class="d-flex gap-3" data-aos="fade-up" data-aos-delay="300">
            <a href="#projects" class="btn btn-primary btn-lg px-5">View Projects</a>
            <a href="#contact" class="btn btn-outline-light btn-lg px-5">Hire Me</a>
          </div>
        </div>
        <div class="col-lg-6 text-center" data-aos="zoom-in" data-aos-delay="400">
          <img src="https://via.placeholder.com/400x400/6366f1/ffffff?text=AVATAR" 
               class="profile-avatar img-fluid rounded-circle shadow-lg" alt="Profile" width="300">
        </div>
      </div>
    </div>
  </section>

  <!-- GITHUB STATS BAR -->
  <section class="stats-bar py-4 bg-dark border-bottom">
    <div class="container">
      <div class="row text-center text-white">
        <div class="col-md-3">
          <div class="stat-number h2 fw-bold repo-count">0</div>
          <div>Repositories</div>
        </div>
        <div class="col-md-3">
          <div class="stat-number h2 fw-bold follower-count">0</div>
          <div>Followers</div>
        </div>
        <div class="col-md-3">
          <div class="stat-number h2 fw-bold stars-total">0</div>
          <div>Total Stars</div>
        </div>
        <div class="col-md-3">
          <div class="stat-number h2 fw-bold">42</div>
          <div>Contributions</div>
        </div>
      </div>
    </div>
  </section>

  <!-- PROJECTS MASONRY -->
  <section id="projects" class="py-5">
    <div class="container">
      <h2 class="text-center mb-5" data-aos="fade-up">Featured GitHub Projects</h2>
      <div class="row g-4" id="projects-grid">
        <!-- Live GitHub repos populate here via JS -->
        <div class="col-lg-4 col-md-6 repo-card">
          <div class="card h-100 shadow-lg border-0 hover-lift">
            <div class="card-body">
              <h5 class="card-title">Loading Supreme Repo...</h5>
              <p class="card-text">Language • Stars • Description</p>
              <div class="d-flex justify-content-between">
                <span class="badge bg-success">React</span>
                <span class="text-muted small">★ 1.2k</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- More sections: Skills, Testimonials, Contact... -->
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="./src/index.js"></script>
</body>
</html>
